<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>フィールドリサーチ一覧｜今日のポケGOイベント</title>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --text:#14171c; --sub:#5b6472; --line:#e3e7ee;
  --accent:#1f6feb; --muted:#9aa3b1; --event:#d6409f; --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1115; --panel:#1a1d24; --text:#eceff4; --sub:#a3acba; --line:#2b303a; --muted:#6c7584; }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:760px;margin:0 auto;padding:12px 14px 40px}
.nav{display:flex;gap:8px;margin:2px 0 6px;overflow-x:auto;scrollbar-width:none}
.nav a{flex:0 0 auto}
.nav a{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px}
.nav a.cur{background:var(--accent);border-color:var(--accent);color:#fff}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:6px 2px 8px}
header.top h1{font-size:20px;margin:0}
header.top .sub{font-size:13px;color:var(--sub);margin-top:2px}
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.btn[disabled]{opacity:.5}
.notice{background:#fff4d6;color:#6b4b00;border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
@media (prefers-color-scheme: dark){.notice{background:#3a2f12;color:#f3d999}}
.notice.err{background:#ffe1e1;color:#8a1c1c}
@media (prefers-color-scheme: dark){.notice.err{background:#3f1a1a;color:#ffb4b4}}

.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px}
.search{width:100%;font:inherit;font-size:16px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.count{font-size:12px;color:var(--sub);font-weight:500}

section.cat{margin-top:16px}
section.cat>h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.evbadge{font-size:11px;font-weight:700;color:#fff;background:var(--event);border-radius:6px;padding:2px 7px}
.tasks{display:grid;gap:8px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
section.cat.event .task{border-left:5px solid var(--event)}
.tt{font-size:15px;font-weight:700;line-height:1.4}
.te{font-size:12px;color:var(--sub)}
.rewards{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.rw{display:flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px 9px 3px 4px;font-size:13px;line-height:1.25}
.rw img{width:30px;height:30px;object-fit:contain;flex:0 0 auto}
.rw.noimg{padding-left:9px}
.rw .cp{display:block;font-size:10.5px;color:var(--sub)}
.rw .q{font-weight:700}
.rw.item{border-style:dashed}
.rw.hit{outline:2px solid var(--accent);outline-offset:-1px}
.sh{font-size:11px}
.empty{color:var(--sub);font-size:14px;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);padding:14px;text-align:center}
.meta{font-size:12px;color:var(--sub);margin-top:3px}
.meta b{color:var(--text);font-weight:700}
.task.good{border:2px solid #f5b83d;background:linear-gradient(135deg,#fffaf0,var(--panel) 60%)}
.task.great{border-color:#ea8a00;box-shadow:0 0 0 2px rgba(234,138,0,.18)}
@media (prefers-color-scheme: dark){.task.good{background:linear-gradient(135deg,#2c2414,var(--panel) 60%)}}
section.cat.event .task.good{border-left:5px solid var(--event)}
.good-b{display:inline-block;font-size:11px;font-weight:700;color:#7a4a00;background:#ffe3a3;border-radius:6px;padding:1px 7px;margin-bottom:3px}
@media (prefers-color-scheme: dark){.good-b{background:#5a3f0b;color:#ffd27a}}
.gfold>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700;
  background:var(--panel);border:2px solid #f5b83d;border-radius:var(--radius);padding:10px 12px;-webkit-user-select:none;user-select:none}
.gfold>summary::-webkit-details-marker{display:none}
.gfold[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-style:dashed}
.garrow{display:inline-block;font-size:12px;color:#c27a00;transition:transform .15s}
.gfold[open] .garrow{transform:rotate(90deg)}
.ghint{margin-left:auto;font-size:12px;font-weight:500;color:var(--sub)}
.gfold[open]>.gbox{border-top:none;border-top-left-radius:0;border-top-right-radius:0}
@media (prefers-color-scheme: dark){.gfold>summary{border-color:#a7731c}}
.gbox{background:linear-gradient(135deg,#fff8e6,#fff1f5);border:2px solid #f5b83d;border-radius:var(--radius);padding:4px 12px 8px}
@media (prefers-color-scheme: dark){.gbox{background:linear-gradient(135deg,#2f2614,#2c1a22);border-color:#a7731c}}
.grow{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed rgba(245,184,61,.55);color:inherit;text-decoration:none}
.grow:last-of-type{border-bottom:none}
.gmark{flex:0 0 auto;width:42px;font-size:15px;white-space:nowrap}
.gtext{flex:1;min-width:0;font-size:14.5px;line-height:1.4}
.gsub{display:block;font-size:12px;color:var(--sub)}
.gtag{font-size:12px;color:var(--sub)}
.evbadge.sm{font-size:10px;padding:1px 5px;vertical-align:1px}
.how{font-size:12px;color:var(--sub);margin-top:4px}
.how summary{cursor:pointer}
.how p{margin:4px 0}
html{scroll-padding-top:120px}
footer{margin-top:28px;font-size:12px;color:var(--sub);line-height:1.7}
footer a{color:var(--sub)}
</style>
</head>

<script>
"use strict";
const SOURCE = "https://raw.githubusercontent.com/Shin632/pokego-today/data/research.json";
// 予備：ScrapedDuck（ポケモン報酬のみ）
const FALLBACK = "https://raw.githubusercontent.com/bigfoott/ScrapedDuck/data/research.json";
const CACHE_KEY = "pogo-research-cache-v1";

// ===== カテゴリ =====
const CATS = {
  "Catching Tasks": ["捕まえる", "🎯"], "Throwing Tasks": ["投げる", "⚾"], "Battling Tasks": ["バトル", "⚔️"],
  "Exploring Tasks": ["探索", "🧭"], "Training Tasks": ["育てる", "💪"], "Team GO Rocket Tasks": ["GOロケット団", "🚀"],
  "Buddy & Friendship Tasks": ["相棒・フレンド", "🤝"], "AR Scanning Tasks": ["ARスキャン", "📷"], "Sponsored Tasks": ["スポンサー", "🏪"],
  "Event Tasks": ["イベント", "🎉"],
};
// ScrapedDuck の type → 見出し
const SD_TYPES = {event:"Event Tasks",catch:"Catching Tasks",throw:"Throwing Tasks",battle:"Battling Tasks",explore:"Exploring Tasks",
  training:"Training Tasks",rocket:"Team GO Rocket Tasks",buddy:"Buddy & Friendship Tasks",ar:"AR Scanning Tasks",sponsored:"Sponsored Tasks"};
function catInfo(name){
  if (CATS[name]) return {ja: CATS[name][0], icon: CATS[name][1], event: name === "Event Tasks"};
  const m = String(name).match(/^(.+?) Tasks$/);
  return {ja: m ? jaMons(m[1]) : (name || "その他"), icon: "🎉", event: true};
}

// ===== タスク文の翻訳 =====
const TYPES_JA = {Normal:"ノーマル",Fire:"ほのお",Water:"みず",Grass:"くさ",Electric:"でんき",Ice:"こおり",Fighting:"かくとう",Poison:"どく",
  Ground:"じめん",Flying:"ひこう",Psychic:"エスパー",Bug:"むし",Rock:"いわ",Ghost:"ゴースト",Dragon:"ドラゴン",Dark:"あく",Steel:"はがね",Fairy:"フェアリー"};
const THROWS = {Nice:"ナイス",Great:"グレート",Excellent:"エクセレント"};
const STARS = {one:1,two:2,three:3,four:4,five:5,six:6};
const N = (w) => /^an?$/i.test(w) ? 1 : w;
const row = (r) => r ? "連続で" : "";
const TASK_RULES = [
  [/^Catch (\d+|an?) Pokémon$/i, (n) => `ポケモンを${N(n)}匹捕まえる`],
  [/^Catch (\d+|an?) (\w+)- or (\w+)-type Pokémon$/i, (n, a, b) => `${TYPES_JA[a] || a}か${TYPES_JA[b] || b}タイプのポケモンを${N(n)}匹捕まえる`],
  [/^Catch (\d+|an?) (\w+)-type Pokémon$/i, (n, t) => `${TYPES_JA[t] || t}タイプのポケモンを${N(n)}匹捕まえる`],
  [/^Catch (\d+) different species of Pokémon$/i, (n) => `ちがう種類のポケモンを${n}匹捕まえる`],
  [/^Catch (\d+|an?) Pokémon with Weather Boost$/i, (n) => `天候ブーストされたポケモンを${N(n)}匹捕まえる`],
  [/^Catch (\d+|an?) Shadow Pokémon$/i, (n) => `シャドウポケモンを${N(n)}匹捕まえる`],
  [/^Use (\d+|an?) Berr(?:y|ies) to help catch Pokémon$/i, (n) => `きのみを${N(n)}個使ってポケモンを捕まえる`],
  [/^Make (\d+|an?) (Nice|Great|Excellent) Curveball Throws?( in a row)?$/i, (n, t, r) => `${THROWS[t]}カーブボールを${N(n)}回${row(r)}投げる`],
  [/^Make (\d+|an?) (Nice|Great|Excellent) Throws?( in a row)?$/i, (n, t, r) => `${THROWS[t]}スローを${N(n)}回${row(r)}投げる`],
  [/^Make (\d+|an?) Curveball Throws?( in a row)?$/i, (n, r) => `カーブボールを${N(n)}回${row(r)}投げる`],
  [/^Battle in (\d+|an?) raids?$/i, (n) => `レイドバトルに${N(n)}回参加する`],
  [/^Win (\d+|an?) raids?$/i, (n) => `レイドバトルに${N(n)}回勝つ`],
  [/^Win an? (\w+)-star raid or higher$/i, (s) => `★${STARS[s.toLowerCase()] || s}以上のレイドバトルに勝つ`],
  [/^Win (\d+|an?) Max Battles?$/i, (n) => `マックスバトルに${N(n)}回勝つ`],
  [/^Battle in (\d+|an?) Max Battles?$/i, (n) => `マックスバトルに${N(n)}回参加する`],
  [/^Unlock (\d+|an?) Max Moves?$/i, (n) => `マックスわざを${N(n)}回解放する`],
  [/^Defeat (\d+|an?) Team GO Rocket Grunts?$/i, (n) => `GOロケット団のしたっぱに${N(n)}回勝つ`],
  [/^Earn (\d+) Stardust$/i, (n) => `ほしのすなを${n}集める`],
  [/^Earn (\d+) XP$/i, (n) => `XPを${n}獲得する`],
  [/^Earn (\d+|an?) Cand(?:y|ies) walking with your buddy$/i, (n) => `相棒と歩いてアメを${N(n)}個見つける`],
  [/^Explore (\d+(?:\.\d+)?) km$/i, (n) => `${n}km歩く`],
  [/^Hatch (\d+|an?) Eggs?$/i, (n) => `タマゴを${N(n)}個かえす`],
  [/^Spin (\d+|an?) PokéStops? or Gyms?$/i, (n) => `ポケストップかジムを${N(n)}回まわす`],
  [/^Spin (\d+|an?) PokéStops?$/i, (n) => `ポケストップを${N(n)}回まわす`],
  [/^Take a snapshot of a wild Pokémon$/i, () => "野生のポケモンのGOスナップショットを撮る"],
  [/^Take (\d+|an?) snapshots? of (.+)$/i, (n, w) => `${jaMons(w)}のGOスナップショットを${N(n)}回撮る`],
  [/^Evolve (\d+|an?) Pokémon$/i, (n) => `ポケモンを${N(n)}匹進化させる`],
  [/^Power up Pokémon (\d+) times$/i, (n) => `ポケモンを${n}回強化する`],
  [/^Send (\d+|an?) Gifts? and add a sticker to each$/i, (n) => `ステッカーを付けてギフトを${N(n)}個送る`],
  [/^Send (\d+|an?) Gifts? to friends$/i, (n) => `フレンドにギフトを${N(n)}個送る`],
  [/^Trade (\d+|an?) Pokémon$/i, (n) => `ポケモンを${N(n)}回交換する`],
  [/^Purify (\d+|an?) Shadow Pokémon$/i, (n) => `シャドウポケモンを${N(n)}匹リトレーンする`],
  [/^Mega Evolve (\d+|an?) Pokémon$/i, (n) => `ポケモンを${N(n)}回メガシンカさせる`],
  [/^Transfer (\d+|an?) Pokémon$/i, (n) => `ポケモンを${N(n)}匹博士に送る`],
  [/^Battle in the GO Battle League (\d+) times$/i, (n) => `GOバトルリーグで${n}回対戦する`],
  [/^Win (\d+|an?) battles? in the GO Battle League$/i, (n) => `GOバトルリーグで${N(n)}回勝つ`],
  [/^Use (\d+|an?) supereffective Charged Attacks?.*$/i, (n) => `効果ばつぐんのスペシャルアタックを${N(n)}回使う`],
  [/^Play with your buddy (\d+) times$/i, (n) => `相棒と${n}回遊ぶ`],
  [/^Give your buddy (\d+|an?) treats?$/i, (n) => `相棒におやつを${N(n)}回あげる`],
  [/^Earn (\d+|an?) hearts? with your buddy$/i, (n) => `相棒とハートを${N(n)}個ためる`],
  [/^Catch (\d+|an?) (.+)$/i, (n, w) => { const j = jaMons(w); return j !== w ? `${j}を${N(n)}匹捕まえる` : null; }],
];
function translateTask(t){
  const s = String(t || "").trim();
  for (const [re, fn] of TASK_RULES){ const m = s.match(re); if (m){ const r = fn(...m.slice(1)); if (r) return {ja: r, ok: true}; } }
  return {ja: jaMons(s), ok: false};
}

// ===== 報酬名の翻訳 =====
const ITEMS = {
  "Stardust":"ほしのすな","Poké Ball":"モンスターボール","Great Ball":"スーパーボール","Ultra Ball":"ハイパーボール","Master Ball":"マスターボール",
  "Razz Berry":"ズリのみ","Nanab Berry":"ナナのみ","Pinap Berry":"パイルのみ","Golden Razz Berry":"金のズリのみ","Silver Pinap Berry":"銀のパイルのみ",
  "Rare Candy":"ふしぎなアメ","Rare Candy XL":"ふしぎなアメXL","Poffin":"ポフィン",
  "Potion":"キズぐすり","Super Potion":"いいキズぐすり","Hyper Potion":"すごいキズぐすり","Max Potion":"まんたんのくすり",
  "Revive":"げんきのかけら","Max Revive":"げんきのかたまり",
  "Fast TM":"わざマシン ノーマル","Charged TM":"わざマシン スペシャル","Elite Fast TM":"すごいわざマシン ノーマル","Elite Charged TM":"すごいわざマシン スペシャル",
  "Incense":"おこう","Lure Module":"ルアーモジュール","Lucky Egg":"しあわせタマゴ","Star Piece":"ほしのかけら",
  "Sun Stone":"たいようのいし","King's Rock":"おうじゃのしるし","Metal Coat":"メタルコート","Dragon Scale":"りゅうのウロコ","Up-Grade":"アップグレード",
  "Sinnoh Stone":"シンオウのいし","Unova Stone":"イッシュのいし","Max Particles":"マックス粒子","XP":"XP",
  "Premium Battle Pass":"プレミアムバトルパス","Remote Raid Pass":"リモートレイドパス","Raid Pass":"レイドパス",
  "Egg Incubator":"ふかそうち","Super Incubator":"スーパーふかそうち","Mysterious Component":"ふしぎなパーツ","Rocket Radar":"ロケットレーダー",
};
function rewardJa(r){
  const n = String(r.name || "");
  if (r.type === "encounter") return jaMons(n);
  if (ITEMS[n]) return ITEMS[n];
  let m;
  if ((m = n.match(/^(.+) Candy XL$/))) return `${jaMons(m[1])}のアメXL`;
  if ((m = n.match(/^(.+) Candy$/))) return `${jaMons(m[1])}のアメ`;
  if ((m = n.match(/^(.+) Mega Energy$/))) return `${jaMons(m[1])}のメガエナジー`;
  return jaMons(n);
}

// ===== 「割に合う」判定（手間と見返りの目安。データ元に無い情報なので、このアプリ独自の目安） =====
const COMMON_TYPES = new Set(["Normal","Water","Grass","Flying","Bug","Poison","Ground","Rock"]);
const num = (w) => /^an?$/i.test(w) ? 1 : +w;
/** 手間 1（すぐ終わる）〜5（かなり大変）と、その理由 */
const EFFORT_RULES = [
  [/^Take (?:a|\d+) snapshots?/i, () => [1, "写真を撮るだけ"]],
  [/^Spin (\d+|an?) PokéStops?(?: or Gyms?)?$/i, (n) => [num(n) <= 3 ? 1 : num(n) <= 5 ? 1.5 : 2.5, "ポケストップを回すだけ"]],
  [/^Evolve (\d+|an?) Pokémon$/i, (n) => [num(n) <= 1 ? 1.5 : 2.5, "進化させるだけ（アメを使う）"]],
  [/^Power up Pokémon (\d+) times$/i, (n) => [num(n) <= 3 ? 1.5 : num(n) <= 5 ? 2 : num(n) <= 8 ? 2.5 : 3, "強化するだけ（ほしのすなを使う）"]],
  [/^Use (\d+|an?) Berr(?:y|ies)/i, (n) => [num(n) <= 5 ? 1.5 : 2.5, "きのみを使いながら捕まえる"]],
  [/^Send (\d+|an?) Gifts?/i, (n) => [num(n) <= 3 ? 2 : 3, "ギフトを送る（フレンドとギフトが必要）"]],
  [/^Catch (\d+) different species/i, (n) => [num(n) <= 7 ? 2 : 3, "いろいろな種類を捕まえる"]],
  [/^Catch (\d+|an?) Pokémon with Weather Boost$/i, (n) => [num(n) <= 5 ? 2 : 3, "天候ブーストのポケモンを捕まえる"]],
  [/^Catch (\d+|an?) (\w+)-type Pokémon$/i, (n, t) => {
    const k = num(n), rare = !COMMON_TYPES.has(t);
    return [Math.min(5, (k <= 1 ? 1.5 : k <= 5 ? 2 : 2.5) + (rare ? 1.5 : 0)), rare ? `出にくい${TYPES_JA[t] || t}タイプを探す` : "よく出るタイプを捕まえる"];
  }],
  [/^Catch (\d+|an?) Pokémon$/i, (n) => { const k = num(n); return [k <= 10 ? 2 : k <= 25 ? 3 : 4, ""]; }],
  [/^Catch a Ditto$/i, () => [4, "メタモンは見分けられず運しだい"]],
  [/^Make (\d+|an?) Excellent (?:Curveball )?Throws?( in a row)?$/i, (n, r) => [Math.min(5, 2.5 + num(n) * 0.5 + (r ? 1 : 0)), "エクセレントは難しい"]],
  [/^Make (\d+|an?) Great Curveball Throws?( in a row)?$/i, (n, r) => [Math.min(5, 2 + num(n) * 0.3 + (r ? 1 : 0)), "グレート＋カーブ"]],
  [/^Make (\d+|an?) Great Throws?( in a row)?$/i, (n, r) => [Math.min(5, 1.5 + num(n) * 0.2 + (r ? 0.8 : 0)), "グレートスロー"]],
  [/^Make (\d+|an?) Nice (?:Curveball )?Throws?( in a row)?$/i, (n, r) => [Math.min(5, 1.2 + num(n) * 0.12 + (r ? 0.5 : 0)), "ナイスは比較的かんたん"]],
  [/^Make (\d+|an?) Curveball Throws?( in a row)?$/i, (n, r) => [Math.min(5, 1.5 + num(n) * 0.1 + (r ? 0.5 : 0)), "カーブボール"]],
  [/^Defeat (\d+|an?) Team GO Rocket Grunts?$/i, (n) => [num(n) <= 1 ? 2.5 : 3.5, "したっぱとバトル"]],
  [/^Battle in (\d+|an?) raids?$/i, (n) => [num(n) <= 1 ? 4 : 5, "レイドパスが必要"]],
  [/^Win (\d+|an?) raids?$/i, (n) => [num(n) <= 1 ? 4 : 5, "レイドパスが必要"]],
  [/^Win an? \w+-star raid or higher$/i, () => [4.5, "レイドパスと★3以上の勝利が必要"]],
  [/^Win (\d+|an?) Max Battles?$/i, (n) => [num(n) <= 1 ? 3.5 : 4.5, "マックス粒子が必要"]],
  [/^Unlock (\d+|an?) Max Moves?$/i, () => [3, "アメとほしのすなを使う"]],
  [/^Earn (\d+) Stardust$/i, (n) => [num(n) >= 10000 ? 4 : 3, "たくさん集める必要がある"]],
  [/^Earn (\d+) XP$/i, (n) => [num(n) >= 10000 ? 3.5 : 2.5, "たくさん集める必要がある"]],
  [/^Earn (\d+|an?) Cand(?:y|ies) walking/i, (n) => [num(n) <= 1 ? 2.5 : num(n) <= 2 ? 3 : 4, "相棒と歩く必要がある"]],
  [/^Explore (\d+(?:\.\d+)?) km$/i, (n) => [+n <= 1 ? 2.5 : +n <= 2 ? 3.5 : 5, `${n}km歩く必要がある`]],
  [/^Hatch (\d+|an?) Eggs?$/i, (n) => [num(n) <= 1 ? 3.5 : num(n) <= 2 ? 4.5 : 5, "タマゴをかえすには歩く必要がある"]],
  [/^Trade (\d+|an?) Pokémon$/i, () => [4.5, "交換相手が近くに必要"]],
  [/^Purify/i, () => [3, "ほしのすなとアメを使う"]],
  [/^Mega Evolve/i, () => [2.5, "メガエナジーを使う"]],
];
function taskEffort(text){
  for (const [re, fn] of EFFORT_RULES){ const m = String(text).match(re); if (m){ const [lv, why] = fn(...m.slice(1)); return {lv, why, known: true}; } }
  return {lv: 3, why: "", known: false};
}
// 出会えると人気・貴重なポケモン（このアプリの判断。ドラゴン系の進化前、化石、ラプラスなど）
const PRIZE_MONS = new Set(["Dratini","Larvitar","Bagon","Beldum","Gible","Axew","Deino","Goomy","Jangmo-o","Frigibax","Dreepy",
  "Lapras","Snorlax","Aerodactyl","Omanyte","Kabuto","Lileep","Anorith","Cranidos","Shieldon","Tirtouga","Archen","Tyrunt","Amaura",
  "Spinda","Ditto","Riolu","Feebas","Scyther","Chansey","Togepi","Ralts","Mawile"]);
const interp = (x, pts) => { if (x <= pts[0][0]) return pts[0][1]; for (let i = 1; i < pts.length; i++){ const [x1, y1] = pts[i], [x0, y0] = pts[i-1]; if (x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0); } return pts[pts.length-1][1]; };
/** 報酬1つの価値 0〜10（目安） */
function rewardValue(r){
  const n = r.name || "", q = +r.qty || 1;
  if (r.type === "encounter") return PRIZE_MONS.has(n.replace(/^(Alolan|Galarian|Hisuian|Paldean) /, "")) ? 5 : 2;
  if (/^Rare Candy XL$/.test(n)) return 10;
  if (/^Rare Candy$/.test(n)) return Math.min(10, 5 + q * 1.3);
  if (n === "Stardust") return interp(q, [[0,0],[200,1],[500,2],[1000,3.5],[1500,4.5],[2000,5],[5000,7]]);
  if (/Mega Energy$/.test(n)) return Math.min(7, 2 + q / 10);
  if (/ Candy XL$/.test(n)) return Math.min(8, 3 + q);
  if (/ Candy$/.test(n)) return Math.min(7, 1 + q / 5);
  if (/^Golden Razz Berry$|^Silver Pinap Berry$/.test(n)) return Math.min(5, 1.5 + q * 0.6);
  if (/^Ultra Ball$/.test(n)) return Math.min(4, q * 0.3);
  if (/^Great Ball$/.test(n)) return Math.min(3, q * 0.2);
  if (/^Poké Ball$/.test(n)) return Math.min(2, q * 0.1);
  if (/Berry$/.test(n)) return Math.min(2, q * 0.25);
  if (/^Elite (Fast|Charged) TM$/.test(n)) return 9;
  if (/TM$/.test(n)) return 3;
  if (/^(Sinnoh|Unova) Stone$|^Sun Stone$|^King's Rock$|^Metal Coat$|^Dragon Scale$|^Up-Grade$/.test(n)) return 4;
  if (/^Poffin$|^Lucky Egg$|^Star Piece$/.test(n)) return 3;
  if (/^Max Particles$/.test(n)) return Math.min(5, q / 100);
  if (/Potion$|Revive$/.test(n)) return 0.5;
  return 1.5;
}
/** タスクの評価：見返りは「出る可能性のある報酬の平均」（出る確率は不明なので同じとみなす） */
function scoreTask(t){
  const eff = taskEffort(t.text);
  const vals = t.rewards.map(r => ({r, v: rewardValue(r)}));
  const avg = vals.length ? vals.reduce((a, b) => a + b.v, 0) / vals.length : 0;
  const best = vals.slice().sort((a, b) => b.v - a.v).slice(0, 2).filter(x => x.v >= 3).map(x => x.r);
  const ratio = avg / eff.lv;
  const ok = eff.known && vals.length > 0 && avg >= 2.5;
  return {effort: eff, value: avg, ratio, best, good: ok && ratio >= GOOD_RATIO, great: ok && ratio >= GREAT_RATIO};
}
const GOOD_RATIO = 1.2, GREAT_RATIO = 2;
const effortLabel = (lv) => lv <= 1.5 ? "かんたん" : lv <= 2.5 ? "少し" : lv <= 3.5 ? "ふつう" : lv <= 4.5 ? "大変" : "かなり大変";
const valueLabel = (v) => v >= 6 ? "大" : v >= 3.5 ? "中〜大" : v >= 2.5 ? "中" : v >= 1.5 ? "小" : "少ない";

// ===== 絞り込み =====
const FILTERS = [
  ["all", "すべて", () => true],
  ["good", "👍 割に合う", null],
  ["pokemon", "ポケモン", (r) => r.type === "encounter"],
  ["rare", "ふしぎなアメ", (r) => /^Rare Candy/.test(r.name)],
  ["dust", "ほしのすな", (r) => r.name === "Stardust"],
  ["mega", "メガエナジー", (r) => /Mega Energy$/.test(r.name)],
  ["candy", "アメ（種類別）", (r) => /. Candy( XL)?$/.test(r.name) && !/^Rare Candy/.test(r.name)],
  ["ball", "ボール・きのみ", (r) => /Ball$|Berry$/.test(r.name)],
];
let filter = "all", query = "";

// ===== データ =====
let CATS_DATA = null, updatedAt = null, isFallback = false;
function fromOwn(d){
  if (!d || !Array.isArray(d.categories)) throw new Error("形式が違います");
  return d.categories.map(c => ({name: String(c.name || ""), tasks: (c.tasks || []).map(t => ({
    text: String(t.text || ""), rewards: (t.rewards || []).map(r => ({type: r.type === "encounter" ? "encounter" : (r.type || "item"),
      name: String(r.name || ""), image: safeUrl(r.image), shiny: !!r.shiny, cpMin: r.cpMin, cpMax: r.cpMax, qty: r.qty}))}))}));
}
function fromScrapedDuck(d){
  if (!Array.isArray(d)) throw new Error("形式が違います");
  const map = new Map();
  for (const t of d){
    const name = SD_TYPES[t.type] || "Event Tasks";
    if (!map.has(name)) map.set(name, []);
    map.get(name).push({text: String(t.text || "").replace(/<[^>]+>/g, "").trim(), rewards: (t.rewards || []).map(r => ({
      type: "encounter", name: String(r.name || ""), image: safeUrl(r.image), shiny: !!r.canBeShiny,
      cpMin: r.combatPower && r.combatPower.min, cpMax: r.combatPower && r.combatPower.max}))});
  }
  const order = ["Event Tasks", ...Object.keys(CATS)];
  return [...map.entries()].sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0])).map(([name, tasks]) => ({name, tasks}));
}
function prepare(cats){
  for (const c of cats){
    c.info = catInfo(c.name);
    for (const t of c.tasks){
      const tr = translateTask(t.text); t.ja = tr.ja; t.ok = tr.ok;
      for (const r of t.rewards) r.ja = rewardJa(r);
      t.score = scoreTask(t);
      t.hay = (t.ja + " " + t.text + " " + t.rewards.map(r => r.ja + " " + r.name).join(" ")).toLowerCase();
    }
  }
  // イベントのタスクを先頭に
  let i = 0; for (const c of cats) for (const t of c.tasks) t.anchor = "task-" + (i++);
  return cats.sort((a, b) => (b.info.event - a.info.event));
}
async function getJson(url){
  const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 12000);
  try { const res = await fetch(url, {cache: "no-cache", signal: ctl.signal}); if (!res.ok) throw new Error("HTTP " + res.status); return await res.json(); }
  finally { clearTimeout(timer); }
}
let loading = false;
async function refresh(){
  if (loading) return; loading = true;
  const btn = document.getElementById("reload"); btn.disabled = true; btn.textContent = "更新中…";
  try {
    try {
      const d = await getJson(SOURCE);
      CATS_DATA = prepare(fromOwn(d)); updatedAt = d.updatedAt ? new Date(d.updatedAt) : new Date(); isFallback = false;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch {}
      setNotice("");
    } catch (e1){
      const d = await getJson(FALLBACK);
      CATS_DATA = prepare(fromScrapedDuck(d)); updatedAt = new Date(); isFallback = true;
      setNotice("詳しいデータを読み込めなかったため、予備のデータ（ポケモン報酬のみ）を表示しています。アイテム報酬は出ません。", false);
    }
  } catch (e){
    if (CATS_DATA) setNotice(`最新データを取得できませんでした（${esc(e.message || e)}）。前回のデータを表示しています。`, false);
    else setNotice(`データを取得できませんでした（${esc(e.message || e)}）。通信環境を確認して「更新」を押してください。`, true);
  } finally {
    loading = false; btn.disabled = false; btn.textContent = "↻ 更新"; render();
  }
}
function setNotice(html, isErr){
  document.getElementById("notice").innerHTML = html ? `<div class="notice${isErr ? " err" : ""}">${html}</div>` : "";
}

// ===== 描画 =====
function rewardHtml(r, hit){
  const img = r.image ? `<img src="${esc(r.image)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('noimg');this.remove()">` : "";
  const cls = ["rw", r.type === "encounter" ? "mon" : "item"]; if (!img) cls.push("noimg"); if (hit) cls.push("hit");
  if (r.type === "encounter"){
    const cp = r.cpMax ? `<span class="cp">CP ${esc(r.cpMin)}〜${esc(r.cpMax)}</span>` : "";
    return `<span class="${cls.join(" ")}">${img}<span>${esc(r.ja)}${r.shiny ? `<span class="sh" title="色違いあり">✨</span>` : ""}${cp}</span></span>`;
  }
  return `<span class="${cls.join(" ")}">${img}<span>${esc(r.ja)}${r.qty ? ` <span class="q">×${esc(Number(r.qty).toLocaleString())}</span>` : ""}</span></span>`;
}
let goodOpen = false;   // 「割に合うタスク」欄は最初はたたんでおく
function goodSummary(){
  const list = [];
  for (const c of CATS_DATA) for (const t of c.tasks) if (t.score.good) list.push({c, t});
  list.sort((a, b) => b.t.score.ratio - a.t.score.ratio);
  const rows = list.map(({c, t}) => {
    const best = t.score.best.map(r => r.ja + (r.qty ? `×${Number(r.qty).toLocaleString()}` : "")).join("・");
    return `<a class="grow" href="#${t.anchor}"><span class="gmark">${t.score.great ? "👍👍" : "👍"}</span>
      <span class="gtext"><b>${esc(t.ja)}</b>${c.info.event ? ` <span class="evbadge sm">イベント</span>` : c.name === "Sponsored Tasks" ? ` <span class="gtag">（スポンサー）</span>` : ""}
      <span class="gsub">手間：${effortLabel(t.score.effort.lv)}${best ? ` ／ ${esc(best)} などが出る` : ""}</span></span></a>`;
  }).join("");
  return `<section class="cat goodsum"><details class="gfold"${goodOpen ? " open" : ""}>
    <summary><span class="garrow" aria-hidden="true">▶</span>👍 割に合うタスク <span class="count">${list.length}件</span><span class="ghint">${goodOpen ? "タップでたたむ" : "タップで表示"}</span></summary>
    <div class="gbox">${rows || `<div class="gsub">今は目立って割に合うタスクはありません</div>`}
    <details class="how"><summary>判定のしかた</summary>
      <p>データ元には「手間」も「報酬の価値」も無いため、このアプリ独自の目安で点数を付けています。</p>
      <p>・<b>手間</b>：タスクの内容から5段階（例：写真を撮る・ポケストップ3回＝かんたん、レイド＝レイドパスが必要なので大変、タマゴ・km＝歩くので大変）。</p>
      <p>・<b>見返り</b>：報酬の中身から点数化（例：ふしぎなアメ・ほしのすな2,000以上・メガエナジー・伝説のポケモンのアメは高め、ボールやきのみは低め。ポケモンは、ドラゴン系の進化前・化石・ラプラスなど人気のものを高めにしています）。どの報酬がどれくらいの確率で出るかは公開されていないので、並んでいる報酬が<b>同じ確率で出ると仮定して平均</b>しています。</p>
      <p>・見返りが手間の1.2倍以上を「割に合う」、2倍以上を「とても割に合う」としています。あくまで目安です。</p>
    </details></div></details></section>`;
}
function render(){
  const f = FILTERS.find(x => x[0] === filter) || FILTERS[0];
  document.getElementById("chips").innerHTML = FILTERS.map(([k, label]) =>
    `<button type="button" class="chip${k === filter ? " sel" : ""}" data-f="${k}">${label}</button>`).join("");
  document.getElementById("lastUpdated").textContent = updatedAt ? `データ更新：${fmtD(updatedAt)} ${fmtT(updatedAt)}${isFallback ? "（予備データ）" : ""}` : "";
  const main = document.getElementById("main");
  if (!CATS_DATA){ if (!loading) main.innerHTML = `<div class="empty">表示できるデータがありません</div>`; return; }
  const q = query.trim().toLowerCase();
  let html = "", total = 0;
  if (filter === "all" && !q) html += goodSummary();
  for (const c of CATS_DATA){
    const tasks = c.tasks.filter(t => (!q || t.hay.includes(q)) &&
      (filter === "all" || (filter === "good" ? t.score.good : t.rewards.some(f[2]))));
    if (!tasks.length) continue;
    total += tasks.length;
    const title = c.info.event ? `<span class="evbadge">イベント</span>${esc(c.info.ja)}` : `${c.info.icon} ${esc(c.info.ja)}`;
    html += `<section class="cat${c.info.event ? " event" : ""}"><h2>${title} <span class="count">${tasks.length}件</span></h2><div class="tasks">`;
    for (const t of tasks){
      const hitOf = (r) => (f[2] && filter !== "all" && f[2](r)) || (q && (r.ja + " " + r.name).toLowerCase().includes(q));
      // 絞り込みに当たる報酬を前に
      const rs = [...t.rewards].sort((a, b) => hitOf(b) - hitOf(a));
      const sc = t.score;
      const badge = sc.great ? `<span class="good-b">👍👍 とても割に合う</span>` : sc.good ? `<span class="good-b">👍 割に合う</span>` : "";
      const meta = sc.effort.known ? `<div class="meta">手間：<b>${effortLabel(sc.effort.lv)}</b>${sc.effort.why ? `（${esc(sc.effort.why)}）` : ""} ・ 見返り：<b>${valueLabel(sc.value)}</b></div>` : "";
      html += `<article class="task${sc.great ? " good great" : sc.good ? " good" : ""}" id="${t.anchor}">${badge}<div class="tt">${esc(t.ja)}</div>${t.ja !== t.text ? `<div class="te">${esc(t.text)}</div>` : ""}
        ${meta}<div class="rewards">${rs.map(r => rewardHtml(r, hitOf(r))).join("") || `<span class="te">報酬の情報なし</span>`}</div></article>`;
    }
    html += `</div></section>`;
  }
  main.innerHTML = total ? html : `<div class="empty">条件に合うタスクはありません</div>`;
  const gf = main.querySelector("details.gfold");
  if (gf) gf.addEventListener("toggle", () => {
    goodOpen = gf.open;
    const h = gf.querySelector(".ghint"); if (h) h.textContent = goodOpen ? "タップでたたむ" : "タップで表示";
  });
}

document.getElementById("reload").addEventListener("click", refresh);
document.getElementById("chips").addEventListener("click", (e) => {
  const b = e.target.closest("[data-f]"); if (!b) return; filter = b.dataset.f; render();
});
let qTimer = null;
document.getElementById("q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { query = e.target.value; render(); }, 120); });

try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); if (c){ CATS_DATA = prepare(fromOwn(c)); updatedAt = c.updatedAt ? new Date(c.updatedAt) : null; } } catch {}
render();
refresh();
</script>
</body>
</html>
