name: イベントのボーナス・リサーチ・レイド・育成ランキングを更新

on:
  schedule:
    - cron: "23 */3 * * *"   # 3時間ごと（UTC）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bonuses
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージ
        run: pip install --quiet beautifulsoup4

      - name: 前回のデータを取得
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/bonuses.json" -o prev.json || echo '{}' > prev.json
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/research.json" -o prev_research.json || echo '{}' > prev_research.json
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/rankings.json" -o prev_rankings.json || echo '{}' > prev_rankings.json
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/megas.json" -o prev_megas.json || echo '{}' > prev_megas.json
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/raids.json" -o prev_raids.json || echo '{}' > prev_raids.json
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/pokedex.json" -o prev_pokedex.json || echo '{}' > prev_pokedex.json

      - name: ボーナス情報を収集
        run: |
          mkdir -p out
          python3 tools/scrape_bonuses.py prev.json out/bonuses.json

      - name: フィールドリサーチ情報を収集
        continue-on-error: true
        run: |
          python3 tools/scrape_research.py prev_research.json out/research.json

      - name: 育成ランキング・レイドボスの有利なポケモンを計算
        continue-on-error: true
        run: |
          python3 tools/build_rankings.py prev_rankings.json out/rankings.json prev_megas.json out/megas.json prev_raids.json out/raids.json

      - name: data ブランチに保存
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git add bonuses.json
          [ -f research.json ] && git add research.json
          [ -f rankings.json ] && git add rankings.json
          [ -f megas.json ] && git add megas.json
          [ -f raids.json ] && git add raids.json
          [ -f pokedex.json ] && git add pokedex.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ボーナス情報を更新"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
